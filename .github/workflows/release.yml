name: Release on tag

# Cuts a GitHub Release when the GitLab mirror pushes a version tag (see the
# sync-to-github job in .gitlab-ci.yml). Uses the Actions-provided, repo-scoped
# GITHUB_TOKEN — no personal access token is stored anywhere.

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Create release ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists; nothing to do."
          else
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --notes "Automated release cut from the GitLab sync for HACS." \
              --target "${{ github.sha }}"
          fi
