set_canvas:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: ezlopi
          multiple: true
    start:
      required: false
      default: 0
      selector:
        number:
          min: 0
          mode: box
    rgb:
      required: true
      example: "ff0000 00ff00 0000ff"
      selector:
        text:

draw_image:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: ezlopi
          multiple: true
    image:
      required: true
      example: "/config/www/strip.png"
      selector:
        text:
